[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-honeypot"
dynamic = ["version"]
description = "Low-interaction SSH honeypot (Paramiko) with threat scoring and a Flask analytics dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Youssef Hussein" }]
keywords = ["honeypot", "ssh", "security", "threat-intelligence", "blue-team", "paramiko", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "paramiko>=3.4,<4",
    "Flask>=3.0,<4",
    "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
ssh-honeypot = "honeypot.cli:honeypot_main"
ssh-honeypot-dashboard = "honeypot.cli:dashboard_main"

[project.urls]
Homepage = "https://github.com/Youssef840/ssh-honeypot"
Issues = "https://github.com/Youssef840/ssh-honeypot/issues"

[tool.setuptools]
packages = ["honeypot", "honeypot.dashboard"]

[tool.setuptools.dynamic]
version = { attr = "honeypot.__version__" }

[tool.setuptools.package-data]
"honeypot.dashboard" = ["templates/*.html", "static/*"]

# ------------------------------------------------------------------ tooling
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["honeypot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "PIE"]
ignore = [
    "E501",  # long string literals in the shell emulator are intentional
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
